[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rife-superboost-model-425"
version = "0.1.0.dev9"
description = "Pre-generated official RIFE 4.25 optimized precision bundle"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSE.Practical-RIFE"]
readme = "README.md"
dependencies = ["RIFE-SuperBoost==0.1.0.dev9"]

[project.entry-points."rife_superboost.models"]
"4.25" = "rife_superboost_model_425:get_model"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rife_superboost_model_425 = ["assets/*.json", "assets/*.bin", "assets/*.onnx", "assets/LICENSE.Practical-RIFE"]

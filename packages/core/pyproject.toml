[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RIFE-SuperBoost"
version = "0.1.0.dev8"
description = "VapourSynth RIFE interpolation with optional inference backends"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
dependencies = ["VapourSynth>=72"]

[project.optional-dependencies]
tensorrt = ["rife-superboost-tensorrt==0.1.0.dev8"]
model-425 = ["rife-superboost-model-425==0.1.0.dev8"]
model-425-lite = ["rife-superboost-model-425-lite==0.1.0.dev8"]
model-426 = ["rife-superboost-model-426==0.1.0.dev8"]
model-426-large = ["rife-superboost-model-426-large==0.1.0.dev8"]

[tool.setuptools.packages.find]
where = ["src"]
